name: Validate Engine candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -B -m unittest discover -s tests
      - run: python -B scripts/validate_repo.py
      - run: python -m compileall -q custom_components/homeii_flow
